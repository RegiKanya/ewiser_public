name: Run Python Script Every Hour

on:
  schedule:
    - cron: "0 * * * *"  # This cron expression means every hour at minute 0.

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'  # Specify the Python version you need.

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # Assuming you have dependencies listed in requirements.txt

    - name: Run Python script
      run: |
        python create_connection.py  # Replace with the path to your Python script.
